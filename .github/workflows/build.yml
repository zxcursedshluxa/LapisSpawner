name: Build Mod
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip lapis.zip -d ./
      - name: Fix gradle.properties
        run: |
          cd lapis || true
          echo "minecraft_version=1.21.4" > gradle.properties
          echo "yarn_mappings=1.21.4+build.2" >> gradle.properties
          echo "loader_version=0.16.10" >> gradle.properties
          echo "lombok_version=1.18.30" >> gradle.properties
          echo "mod_version=1.0.0" >> gradle.properties
          echo "maven_group=com.example" >> gradle.properties
          echo "archives_base_name=lapisspawner" >> gradle.properties
          echo "fabric_version=0.112.0+1.21.4" >> gradle.properties
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
      - name: Make Gradle Executable
        run: |
          cd lapis || true
          chmod +x gradlew || true
      - name: Build Mod
        run: |
          cd lapis || true
          ./gradlew build --no-daemon
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LapisSpawner-Mod
          path: |
            build/libs/*.jar
            lapis/build/libs/*.jar

